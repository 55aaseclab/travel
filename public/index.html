*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);font-family:inherit;font-size:.9375rem}a{color:var(--accent);text-underline-offset:3px}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button,input,select{font:inherit}button{cursor:pointer}.app-shell{display:flex;gap:1.25rem;align-items:flex-start;max-width:1350px;margin:0 auto;padding:2rem}.app-sidebar{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.4;width:160px;flex-shrink:0;position:sticky;top:2rem;max-height:calc(100dvh - 4rem);overflow-y:auto}.app-name{line-height:1.4;padding:0 .5rem 1rem;font-size:1rem;font-weight:650;letter-spacing:-.02em}.app-name span{line-height:1.4;display:block;font-size:.72rem;font-weight:400;color:var(--muted);margin-top:.15rem;letter-spacing:.02em}.section-nav{display:grid;gap:3px}.section-nav a{line-height:1.4;display:flex;align-items:center;gap:.5rem;min-height:2.25rem;padding:.45rem .5rem;border-radius:.5rem;color:var(--ink);font-size:.875rem;text-decoration:none;white-space:nowrap}.nav-icon{width:1.125rem;height:1.125rem;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.875rem;color:#0066cc;background:#e6edf6;border-radius:.3rem;line-height:1}.nav-label{min-width:0}.nav-count{margin-left:auto;color:var(--muted);font-size:.75rem;font-weight:400;font-variant-numeric:tabular-nums}.section-nav a:hover{background:#f0f0f4}.section-nav a.active,.section-nav a[aria-current]{background:var(--selection);color:var(--ink);font-weight:650}.app-main{line-height:1.6;flex:1;min-width:0;padding:0 0 2rem}.app-main h1,.app-main h2,.app-main h3{font-family:inherit;letter-spacing:-.015em;color:var(--ink);line-height:1.4}.app-main h1{font-size:1.5rem;font-weight:650;margin:0 0 10px}.app-main h2{font-size:1.1875rem;font-weight:600;margin:0 0 16px}.app-main h3{font-size:1rem;font-weight:600;margin:0 0 8px}.app-main p{margin-top:0}.app-main section{margin:0 0 32px;scroll-margin-top:24px}.lead{font-size:.9375rem;max-width:76ch;color:var(--muted);margin-bottom:16px}.subtle,.note,.updated{font-size:.8125rem;color:var(--muted)}.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.8125rem;color:var(--muted);margin:12px 0 20px}.route{font-size:.875rem;max-width:80ch;margin-bottom:16px}.overview{padding-bottom:24px;border-bottom:1px solid var(--line)}.intro-copy{max-width:80ch}.intro-copy p{margin-bottom:8px}.callout{font-size:.875rem;max-width:80ch;background:var(--sidebar);padding:12px 14px;border-radius:6px;margin-top:16px}.trip-list{border-top:1px solid var(--line)}.trip-card,.legacy-plan{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}.trip-card:hover,.legacy-plan:hover{text-decoration:none;background:#fafafa}.trip-card h2,.legacy-plan h2{margin:0 0 5px;font-size:1rem;color:var(--accent)}.trip-card p,.legacy-plan p{margin:0;max-width:72ch;font-size:.875rem;color:var(--muted)}.trip-meta{text-align:right;white-space:nowrap;font-size:.8125rem;color:var(--muted)}.cost{display:block;color:var(--ink);font-weight:600;font-size:.9375rem}.table-wrap{max-width:100%;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:.875rem}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-weight:600;color:var(--muted)}.table td:first-child,.table th:first-child{padding-left:0}.table td:last-child,.table th:last-child{padding-right:0}.budget-table{max-width:720px}.budget-table td:last-child{text-align:right;white-space:nowrap}.total td{font-weight:600}.day{position:relative;padding:18px 0 18px 48px;border-bottom:1px solid var(--line);max-width:84ch}.day:first-of-type{border-top:1px solid var(--line)}.day-label{position:absolute;left:0;top:20px;font-size:.8125rem;font-weight:600;color:var(--muted)}.day p{font-size:.9375rem;margin-bottom:8px}.stay{font-size:.8125rem;color:var(--muted)}.source-links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8125rem;margin:8px 0}.tips{padding-left:22px;max-width:80ch;margin-top:0}.tips li{padding:0 0 12px}.sources{font-size:.875rem;max-width:85ch;padding-left:22px;overflow-wrap:anywhere}.sources li{padding:0 0 14px}.sources span{display:block;color:var(--muted);font-size:.8125rem}.updated{border-top:1px solid var(--line);padding-top:16px;margin:28px 0 0;max-width:90ch}.skip-link{position:fixed;left:12px;top:-60px;z-index:1000;background:#fff;padding:10px 14px;border:2px solid var(--accent);border-radius:6px}.skip-link:focus{top:12px}
@media(max-width:760px){html{scroll-padding-top:16px}.app-shell{flex-direction:column;gap:1rem;padding:1rem}.app-sidebar{position:static;width:100%;max-height:none;overflow:visible}.app-name{line-height:1.4;padding:0 .3rem .8rem}.app-name span{display:inline;margin-left:.6rem}.section-nav{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:0 0 4px}.section-nav a{flex:0 0 auto;gap:.35rem;padding:.45rem .5rem;min-height:44px;font-size:.82rem}.nav-count{margin-left:.3rem}.app-main{width:100%;padding:0 0 1.5rem}.app-main h1{font-size:1.5rem}.app-main section{scroll-margin-top:16px}.trip-card,.legacy-plan{grid-template-columns:1fr;gap:8px;padding:16px 0}.trip-meta{text-align:left}.cost{display:inline;margin-left:6px}.comparison .table{font-size:.8125rem}.comparison th:first-child{min-width:68px}.table td,.table th{padding:10px 6px}.day{padding-left:38px}.facts{gap:4px 12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}
@media print{.app-shell{display:block}.app-sidebar,.skip-link{display:none!important}.app-main{max-width:none;padding:0}.app-shell{padding:0}.app-main section,.day{break-inside:avoid}a{color:inherit}.source-links{font-size:11px}}

.route-cover-placeholder{display:grid!important;place-items:center;color:#8d8d97}.route-cover-placeholder svg{width:32px;height:32px;fill:currentColor}

.catalog-list{display:grid;gap:14px;margin-top:24px;border:0}.trip-card.route-card{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:20px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;min-width:0}.trip-card.route-card:hover{background:#f7f7f9;border-color:#b9bac4;text-decoration:none}.route-cover{display:block;width:112px;height:112px;aspect-ratio:1;object-fit:cover;border-radius:7px;background:var(--selection)}.route-card-copy{min-width:0}.trip-card.route-card h2{font-size:1.125rem;font-weight:600;color:var(--ink);margin:0 0 9px;overflow-wrap:anywhere}.trip-card.route-card p{font-size:.8125rem;line-height:1.6;margin:0;max-width:none;color:var(--muted)}.route-card-facts{overflow-wrap:anywhere}.trip-card.route-card .route-edited{margin-top:14px;font-size:.75rem}.route-card[hidden],.catalog-empty[hidden]{display:none!important}.catalog-empty{padding:40px 0;color:var(--muted);font-size:.9375rem}.catalog-anchor{scroll-margin-top:24px}
@media(max-width:760px){.catalog-list{margin-top:20px;gap:12px}.trip-card.route-card{grid-template-columns:80px minmax(0,1fr);gap:12px;padding:12px}.route-cover{width:80px;height:80px}.trip-card.route-card h2{font-size:1rem;margin-bottom:6px}.trip-card.route-card p{font-size:.75rem}.trip-card.route-card .route-edited{margin-top:8px}}
@media(max-width:360px){.trip-card.route-card{grid-template-columns:68px minmax(0,1fr);gap:10px;padding:10px}.route-cover{width:68px;height:68px}}
</style></head><body><a class="skip-link" href="#main">跳到正文</a><div class="app-shell"><aside class="app-sidebar" aria-label="路线分类"><div class="app-name">Travel<span>旅行计划</span></div><nav class="section-nav" aria-label="旅行路线"><a href="#all" class="active" aria-current="location"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-label">全部路线</span><span class="nav-count" aria-label="0 条路线">0</span></a><a href="#upcoming"><span class="nav-icon" aria-hidden="true">↗</span><span class="nav-label">待出行</span><span class="nav-count" aria-label="0 条路线">0</span></a><a href="#past"><span class="nav-icon" aria-hidden="true">✓</span><span class="nav-label">已出行</span><span class="nav-count" aria-label="0 条路线">0</span></a></nav></aside><main class="app-main" id="main" aria-labelledby="page-title"><div class="catalog-anchor" id="all"><span id="upcoming"></span><span id="past"></span><h1 id="page-title">全部路线</h1><div class="catalog-list"></div><p class="catalog-empty" role="status" hidden>这里还没有路线</p></div></main></div><script data-travel-catalog>
(() => {
  const labels = { all: '全部路线', upcoming: '待出行', past: '已出行' };
  const links = [...document.querySelectorAll('.section-nav a')];
  const cards = [...document.querySelectorAll('.route-card')];
  const title = document.querySelector('#page-title');
  const empty = document.querySelector('.catalog-empty');
  function selectCategory() {
    const requested = location.hash.slice(1);
    const category = Object.hasOwn(labels, requested) ? requested : 'all';
    title.textContent = labels[category];
    let visible = 0;
    for (const card of cards) {
      card.hidden = category !== 'all' && card.dataset.status !== category;
      if (!card.hidden) visible++;
    }
    empty.hidden = visible > 0;
    for (const link of links) {
      const selected = link.hash === '#' + category;
      link.classList.toggle('active', selected);
      if (selected) link.setAttribute('aria-current', 'location');
      else link.removeAttribute('aria-current');
    }
  }
  for (const link of links) link.addEventListener('click', event => {
    if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    if (location.hash !== link.hash) history.pushState(null, '', link.hash);
    selectCategory();
  });
  addEventListener('hashchange', selectCategory);
  addEventListener('popstate', selectCategory);
  selectCategory();
})();
(function installTravelLocale(lang) {
  const sidebar = document.querySelector('.app-sidebar');
  if (!sidebar) return;
  document.documentElement.lang = lang;
  const picker = document.createElement('button');
  picker.type = 'button';
  picker.textContent = lang === 'en' ? '简体中文' : 'English';
  picker.style.minHeight = '44px';
  picker.onclick = () => {
    const next = lang === 'en' ? 'zh' : 'en';
    try { localStorage.setItem('praxis.locale', next); } catch { return; }
    document.cookie = 'praxis_locale=' + next + '; Path=/; SameSite=Lax; Max-Age=31536000' + (location.protocol === 'https:' ? '; Secure' : '');
    location.reload();
  };
  sidebar.append(picker);
  if (lang !== 'en') return;
  for (const node of document.querySelectorAll('[data-travel-en]')) node.textContent = node.dataset.travelEn;
  for (const node of document.querySelectorAll('[data-travel-en-label]')) node.setAttribute('aria-label',node.dataset.travelEnLabel);
  const attributes = [
    ['.itinerary-map','Itinerary map'], ['.travel-map-canvas','Map of itinerary places'],
    ['.map-place-strip','Places on this itinerary'], ['.detail-local-tabs','Itinerary views'], ['.day-tabs','Itinerary days'],
  ];
  for (const [selector,label] of attributes) document.querySelector(selector)?.setAttribute('aria-label',label);
  const toggle = document.querySelector('[data-map-toggle]');
  if (toggle) {
    const label = toggle.getAttribute('aria-expanded') === 'true' ? 'Collapse map' : 'Expand map';
    toggle.setAttribute('aria-label',label); toggle.title=label;
  }
  const mapStatus = document.querySelector('[data-map-status]');
  if (mapStatus?.textContent.trim() === '正在加载地图…') mapStatus.textContent = 'Loading map…';
  const labels = {
    '#travel-map-legend': document.querySelector('[data-itinerary-workspace]')?.dataset.mapProvider === 'leaflet'
      ? 'Dashed lines show the order of stops, not a driving route.'
      : 'Solid lines show road routes. Dashed lines connect stops.',
    '#overview > h2.visually-hidden':'Itinerary overview',
    '.skip-link': 'Skip to content', '.app-name span': 'Trip planner',
    '.section-nav a[href="#all"] .nav-label': 'All routes',
    '.section-nav a[href="#past"] .nav-label': 'Past trips',
    '.section-nav a[href="#upcoming"] .nav-label': 'Upcoming trips',
    '#tab-itinerary':'Itinerary','#tab-budget':'Budget','#tab-preparation':'Preparation',
    '#tab-overview':'Overview','#preparation-before-title':'Before departure',
    '#preparation-moments-title':'Key moments','.photo-credits summary':'Photo credits',
    '.catalog-empty':'No routes in this view.'
  };
  for (const [selector, label] of Object.entries(labels)) {
    for (const node of document.querySelectorAll(selector)) node.textContent = label;
  }
  sidebar.setAttribute('aria-label','Route navigation');
  sidebar.querySelector('nav')?.setAttribute('aria-label','Trip categories');
  for (const node of document.querySelectorAll('.section-nav .nav-count')) node.ariaLabel = node.textContent + ' routes';
  const dayNames = { '抵达日': 'Arrival day', '离开日': 'Departure day', '返程日':'Return day', '第一天':'Day 1', '第二天':'Day 2', '第三天':'Day 3', '第四天':'Day 4', '第五天':'Day 5', '第六天':'Day 6', '第七天':'Day 7' };
  for (const node of document.querySelectorAll('.day-tabs a[id^="tab-day-"], .overview-day-top strong, [data-trip-panel] h2 > [data-day-label]')) {
    if (Object.hasOwn(dayNames,node.textContent)) node.textContent=dayNames[node.textContent];
  }
  const words = {
    '出发前':'Before departure','关键时刻':'Key moments','暂无预算项':'No budget items.',
    '暂无准备提示':'No preparation notes.','暂无关键时刻':'No checkpoints.',
    '已预订':'Booked','预估':'Estimated','待预订':'To book','行程总费用':'Total trip cost',
    '已列预算':'Budgeted total','交通':'Transport','住宿':'Lodging','餐饮':'Meals','其他':'Other',
    '最后编辑：':'Last edited: ','导航':'Directions','小红书':'Xiaohongshu','百度图片':'Baidu Images',
    '查看详情':'View details','打开 Memo':'Open Memo'
  };
  const fixed = '.travel-leg a,.budget-status,.budget-empty,.budget-group h2,.budget-total>span,.route-edited,.preparation-empty,.place-actions a,.memo-link,.leg-row a';
  for (const el of document.querySelectorAll(fixed)) {
    for (const node of el.childNodes) {
      if (node.nodeType !== Node.TEXT_NODE) continue;
      const raw = node.textContent.trim();
      if (Object.hasOwn(words, raw)) node.textContent = words[raw] + (el.children.length ? ' ' : '');
    }
  }
  for (const count of document.querySelectorAll('.route-card-facts span')) {
    const match = /^(\d+) 个(地点|城市)$/.exec(count.textContent.trim());
    if (match) count.textContent = match[1] + (match[2] === '地点' ? ' places' : ' cities');
  }
  for (const el of document.querySelectorAll('.budget-dates time,.preparation-dates time,.overview-day-top time')) {
    const iso=el.getAttribute('datetime');
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) el.textContent = new Intl.DateTimeFormat('en',{dateStyle:'medium'}).format(new Date(iso+'T12:00:00'));
  }
  for (const link of document.querySelectorAll('.memo-link')) {
    const name=link.closest('.preparation-moment')?.querySelector('h3')?.textContent;
    if (name) link.setAttribute('aria-label','Open '+name+' in Memo');
  }
  const intro=document.querySelector('.preparation-intro'); if (intro) intro.textContent='Review these checks before departure, check-in and checkout.';
  const categoryHeading = document.querySelector('#scope-title, .catalog-anchor #page-title');
  if (categoryHeading) {
    const values = {'全部路线':'All routes','待出行':'Upcoming trips','已出行':'Past trips'};
    const update = () => { const label=values[categoryHeading.textContent]; if(label) categoryHeading.textContent=label; };
    update(); new MutationObserver(update).observe(categoryHeading,{childList:true});
  }
})((function readTravelLanguage() {
  try { return localStorage.getItem('praxis.locale') === 'zh' ? 'zh-CN' : 'en'; } catch { return 'en'; }
})());
</script></body></html>
